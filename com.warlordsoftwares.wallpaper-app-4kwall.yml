app-id: com.warlordsoftwares.wallpaper-app-4kwall
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: 5.15-25.08

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

command: 4kwall.sh
rename-icon: icon
rename-desktop-file: wallpaper-app-4kwall.desktop

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-pictures
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.FileManager1
  - --env=QT_ENABLE_HIGHDPI_SCALING=1
  - --env=APP_PLATFORM=FLATPAK

cleanup:
  - /include
  - /lib/pkgconfig

modules:
  - python3-req.json

  - name: wallpaper-app-4kwall
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/4kwall
      - cp -r * ${FLATPAK_DEST}/4kwall
      - install -Dm755 ${FLATPAK_DEST}/4kwall/4kwall.sh -t ${FLATPAK_DEST}/bin/
      - install -Dm644 ${FLATPAK_DEST}/4kwall/share/icons/icon.png -t ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/
      - install -Dm644 ${FLATPAK_DEST}/4kwall/share/applications/wallpaper-app-4kwall.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 ${FLATPAK_DEST}/4kwall/share/metainfo/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: archive
        url: https://warlordsoftwares.com/static/app_builds/flatpak/FLATPAK_4KWALL.tar.gz
        sha256: 9d02878f4b5605ae65a34a5e5f84f110402ecf3c5520f499743e300f18895d4a
